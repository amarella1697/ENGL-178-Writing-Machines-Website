<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellations — The Writing Machines Project</title>
<style>
  :root {
    --sky: #0F0F1D;
    --rail: #131325;
    --ink: #1A1A2E;
    --paper: #E6E7E8;
    --paper-raised: #F1F2F2;
    --ink-soft: #4A4A63;
    --stamp: #C6488C;
    --stamp-soft: #DFA0C2;
    --sage: #00A896;
    --xref: #19D3BE;
    --muted: #9A9AB3;
    --line: #2A2A40;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--sky);
    color: var(--paper);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  }

  body {
    display: grid;
    grid-template-columns: 264px minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }

  .mono {
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ── RAIL ── */
  .rail {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--rail);
    border-right: 1px solid var(--line);
  }

  .rail-head { padding: 20px 20px 16px; }
  h1 { font-weight: 400; font-size: 30px; margin: 16px 0 0; }
  .stats { font-size: 10px; line-height: 1.7; color: var(--muted); margin-top: 8px; }
  .stats span { display: block; }

  a.back {
    display: inline-block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--paper);
    border: 1px solid #55556F;
    border-radius: 2px;
    padding: 7px 10px;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  a.back:hover { background: var(--paper); border-color: var(--paper); color: var(--ink); }
  a.back:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

  /* ── LEGEND ── */
  .legend {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #3A3A55 transparent;
    padding: 4px 0 12px;
    border-top: 1px solid var(--line);
  }
  .legend button {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--paper);
    padding: 8px 20px 8px 17px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .legend button:hover { background: rgba(255, 255, 255, 0.05); }
  .legend button.active { border-left-color: var(--stamp); background: rgba(198, 72, 140, 0.14); color: #fff; }
  .legend button:focus-visible { outline: 2px solid var(--stamp-soft); outline-offset: -2px; }
  .legend .count { font-family: 'Courier New', Courier, monospace; font-size: 12px; color: var(--muted); }
  .legend button.active .count { color: var(--stamp-soft); }

  .rail-foot {
    padding: 14px 20px 18px;
    border-top: 1px solid var(--line);
    font-size: 10px;
    color: var(--muted);
    line-height: 1.8;
  }
  .toggle {
    display: block;
    width: 100%;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--xref);
    background: none;
    border: 1px solid var(--xref);
    border-radius: 2px;
    padding: 8px 10px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: background 0.15s, color 0.15s;
  }
  .toggle:hover { background: rgba(25, 211, 190, 0.12); }
  .toggle.on { background: var(--xref); color: var(--sky); }
  .toggle:focus-visible { outline: 2px solid var(--stamp-soft); outline-offset: 2px; }
  .key-line { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 8px; }
  .hint { margin-top: 8px; }

  /* ── SKY ── */
  .stage { position: relative; overflow: hidden; min-width: 0; min-height: 0; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

  .label {
    position: absolute;
    top: 0; left: 0;
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    font-style: italic;
    font-size: 14px;
    line-height: 20px;
    color: var(--stamp-soft);
    white-space: nowrap;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0 4px;
    transition: opacity 0.3s, color 0.15s;
  }
  .label:hover { color: #fff; }
  .label:focus-visible { outline: 2px solid var(--stamp-soft); outline-offset: 2px; }
  .label.dim { opacity: 0.3; }

  .tip {
    position: absolute;
    top: 0; left: 0;
    width: min(300px, calc(100% - 32px));
    background: var(--paper-raised);
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 2px;
    padding: 12px 14px;
    box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.3);
    font-size: 14px;
    line-height: 1.45;
  }
  .tip[hidden] { display: none; }
  .tip .meta { font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; letter-spacing: 0.04em; }
  .tip .meta b { color: var(--stamp); }
  .tip .frag { margin: 0 0 8px; }
  .tip .cat { font-size: 10px; color: var(--stamp); margin-bottom: 8px; }
  .tip a { font-family: 'Courier New', Courier, monospace; font-size: 11px; color: var(--sage); }

  .notice {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    pointer-events: none;
  }
  .notice[hidden] { display: none; }
  .notice a { color: var(--stamp-soft); pointer-events: auto; }

  /* On phones the sky takes the full width, with the constellations in a strip below it. */
  @media (max-width: 720px) {
    body { display: flex; flex-direction: column; }
    .rail { display: contents; }
    .rail-head {
      order: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 4px 12px;
      padding: 12px 16px 10px;
      background: var(--rail);
      border-bottom: 1px solid var(--line);
    }
    h1 { order: -1; font-size: 24px; margin: 0; }
    .stats { order: 1; width: 100%; margin: 0; }
    .stats { letter-spacing: 0.04em; }
    .stats span { display: inline; margin-right: 8px; white-space: nowrap; }
    .stage { order: 1; flex: 1; }
    .legend {
      order: 2;
      flex: none;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      padding: 10px 16px;
      background: var(--rail);
      border-top: 1px solid var(--line);
    }
    .legend button {
      flex: none;
      width: auto;
      gap: 6px;
      font-size: 14px;
      padding: 6px 12px;
      border: 1px solid #3A3A55;
      border-radius: 20px;
    }
    .legend button.active { border-color: var(--stamp); background: var(--stamp); }
    .legend button.active .count { color: #fff; }
    .rail-foot { order: 3; padding: 0 16px 12px; border-top: none; background: var(--rail); }
    .toggle { margin: 0; }
    .key, .hint { display: none; }
    .label { font-size: 13px; line-height: 16px; }
  }
</style>
</head>
<body>

<aside class="rail">
  <div class="rail-head">
    <a class="back" href="index.html">← Back to the archive</a>
    <h1>Constellations</h1>
    <div class="stats mono" id="stats">Loading the sky…</div>
  </div>

  <nav class="legend" id="legend" aria-label="Constellations"></nav>

  <div class="rail-foot mono">
    <button class="toggle mono" id="xrefToggle" type="button">Show cross-references</button>
    <div class="key">
      <div><span class="key-line" style="background:var(--stamp-soft)"></span>Same constellation</div>
      <div><span class="key-line" style="background:var(--xref)"></span>Cross-reference</div>
    </div>
    <div class="hint">
      <div>Drag to move · scroll to zoom</div>
      <div>Point at a star to read it</div>
      <div>Click a star to open it</div>
    </div>
  </div>
</aside>

<main class="stage" id="stage">
  <canvas id="sky" aria-label="A star chart of the archive: each entry is a star, grouped by constellation"></canvas>
  <div id="labels"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="notice" id="notice" hidden></div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
import firebaseConfig from './firebase-config.js';
import { CONSTELLATIONS, categoryOf } from './constellation-names.js';
import { entrantOf } from './class-names.js';

// A star chart. Each entry is a star and each constellation is a stick figure with its own
// patch of sky. Cross-references stay hidden until someone asks for them, as they would
// otherwise cut across every figure on the chart.

const el = id => document.getElementById(id);
const COLOR = {
  star: new THREE.Color('#F9D5E7'),
  starDim: new THREE.Color('#3A2C45'),
  hover: new THREE.Color('#FFFFFF'),
  link: new THREE.Color('#DFA0C2'),
  linkDim: new THREE.Color('#251F33'),
  xref: new THREE.Color('#19D3BE'),
  xrefSoft: new THREE.Color('#0E8378'),   // the usual color, so they don't compete with the figures
  xrefDim: new THREE.Color('#133B3A'),
  off: new THREE.Color('#000000')       // the arcs add light to the sky, so black draws nothing
};
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Same rules as the archive page: emptied entries are hidden, numbers have no gaps.
const CONTENT_FIELDS = ['entrant', 'fragment', 'imageUrl', 'videoUrl', 'annotation', 'source', 'sourceUrl'];
const isBlank = e => CONTENT_FIELDS.every(f => !String(e[f] || '').trim());

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

function showNotice(html) { el('notice').innerHTML = html; el('notice').hidden = false; }

// ── SCENE ──
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: el('sky'), antialias: true });
} catch (err) {
  showNotice('This browser can\'t draw the star chart. <a href="index.html">Back to the archive</a>');
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0F0F1D');
const FOV = 32;
const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 8000);
camera.position.set(0, 0, 1000);

// The chart is moved and zoomed like a map; it doesn't turn.
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enableRotate = false;
controls.zoomToCursor = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
controls.addEventListener('start', () => { moved = true; flight = null; });

let W = 1, H = 1;             // size of the sky on screen
let moved = false;            // has anyone moved the view since it was last set?

// A soft round glow, used for every star.
function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.16, 'rgba(255,255,255,0.95)');
  grad.addColorStop(0.3, 'rgba(255,255,255,0.3)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glow = glowTexture();

// Stars are sized by how large the chart is on screen, so they stay points on a small sky.
const starMaterial = new THREE.ShaderMaterial({
  uniforms: { map: { value: glow }, zoom: { value: 1 } },
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float size;
    uniform float zoom;
    varying vec3 tint;
    void main() {
      tint = color;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * zoom;
    }`,
  fragmentShader: `
    uniform sampler2D map;
    varying vec3 tint;
    void main() {
      gl_FragColor = vec4(tint, 1.0) * texture2D(map, gl_PointCoord);
      #include <colorspace_fragment>
    }`
});

// Faint background stars, on layers far behind the chart, so the sky has depth as it moves.
function seeded(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

[[-700, 0.45], [-1800, 0.28]].forEach(([z, opacity], layer) => {
  const n = 1100, pos = new Float32Array(n * 3), rnd = seeded(layer + 1);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (rnd() - 0.5) * 6000;
    pos[i * 3 + 1] = (rnd() - 0.5) * 4000;
    pos[i * 3 + 2] = z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    size: 1.3, sizeAttenuation: false, color: '#8A8AA8', transparent: true, opacity
  })));
});

// ── FIGURES ──
// A constellation is built like the ones in the real sky: a small body of three to five
// stars, with limbs reaching out from some of its corners and forking as they get long. The
// body and limbs are chosen from the constellation's name, so each has its own shape. Stars
// are added oldest entry first, so new entries extend the figure and the stars already in it
// stay where they are.
const STEP = 24;              // the usual length of a line
const TURN = Math.PI * 2;

function crosses(a, b, c, d) {
  const side = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
  return side(a, b, c) * side(a, b, d) < 0 && side(c, d, a) * side(c, d, b) < 0;
}

const angleApart = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));

function grow(name, members) {
  const plan = seeded([...name].reduce((h, ch) => Math.imul(h, 31) + ch.charCodeAt(0) | 0, 7));
  const pts = [], edges = [], degree = [], limbs = [];
  const add = p => { pts.push(p); degree.push(0); return pts.length - 1; };
  const join = (a, b) => { edges.push([a, b]); degree[a]++; degree[b]++; };
  // A new line must keep clear of other stars, cross nothing, and fan out from its neighbours.
  const fits = (from, p, angle) => {
    if (pts.some(q => Math.hypot(q.x - p.x, q.y - p.y) < STEP * 0.85)) return false;
    return !edges.some(([s, t]) => {
      if (s !== from && t !== from) return crosses(pts[from], p, pts[s], pts[t]);
      const o = pts[s === from ? t : s];
      return angleApart(angle, Math.atan2(o.y - pts[from].y, o.x - pts[from].x)) < 0.8;
    });
  };

  const corners = 3 + Math.floor(plan() * 3);
  const tilt = plan() * TURN, stretch = 1.1 + plan() * 0.8;

  members.forEach((e, i) => {
    const rnd = seeded(e.id * 7919);
    const z = (rnd() - 0.5) * 12;
    if (i < corners) {
      const a = (i + (plan() - 0.5) * 0.5) / corners * TURN, x = Math.cos(a) * STEP * 0.8 * stretch, y = Math.sin(a) * STEP * 0.8;
      add({ x: x * Math.cos(tilt) - y * Math.sin(tilt), y: x * Math.sin(tilt) + y * Math.cos(tilt), z });
      if (i) join(i - 1, i);
      if (i === corners - 1) {
        join(i, 0);
        // Limbs leave from only some corners, which is what keeps the figure lopsided.
        const start = Math.floor(plan() * corners), count = 2 + Math.floor(plan() * (corners - 1));
        for (let j = 0; j < count; j++) {
          const tip = (start + j * 2) % corners;
          const out = Math.atan2(pts[tip].y, pts[tip].x) + (plan() - 0.5) * 0.7;
          if (!limbs.some(l => l.tip === tip)) limbs.push({ tip, prev: tip, heading: out, weight: j ? 0.35 + plan() * 0.5 : 1, length: 0 });
        }
      }
      return;
    }
    let from = -1, point = null;
    while (!point) {
      const limb = limbs.filter(l => !l.dead).sort((a, b) => a.length / a.weight - b.length / b.weight)[0];
      if (!limb) break;
      for (let k = 0; k < 24 && !point; k++) {
        const angle = limb.heading + (rnd() - 0.5) * (0.8 + k * 0.12), length = STEP * (1 + rnd() * 0.8);
        const a = pts[limb.tip], p = { x: a.x + Math.cos(angle) * length, y: a.y + Math.sin(angle) * length, z };
        if (degree[limb.tip] < 3 && fits(limb.tip, p, angle)) { point = p; from = limb.tip; limb.heading = angle; }
      }
      if (!point) { limb.dead = true; continue; }
      limb.prev = limb.tip;
      limb.tip = i;
      limb.length++;
      if (limb.length % 3 === 0) {
        limbs.push({ tip: limb.prev, prev: limb.prev, heading: limb.heading + (plan() < 0.5 ? -1 : 1) * 1.15, weight: limb.weight * 0.7, length: 0 });
      }
    }
    const cx = pts.reduce((s, p) => s + p.x, 0) / i, cy = pts.reduce((s, p) => s + p.y, 0) / i;
    if (!point) {
      // Boxed in: carry on outward from the outermost star that can take another line.
      from = pts.map((p, j) => j).filter(j => degree[j] < 3)
        .sort((a, b) => Math.hypot(pts[b].x - cx, pts[b].y - cy) - Math.hypot(pts[a].x - cx, pts[a].y - cy))[0];
      const a = pts[from], angle = Math.atan2(a.y - cy, a.x - cx);
      point = { x: a.x + Math.cos(angle) * STEP * 1.2, y: a.y + Math.sin(angle) * STEP * 1.2, z };
    }
    add(point);
    join(from, i);
  });
  // Centre the figure on its own middle.
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const left = Math.min(...xs), right = Math.max(...xs), low = Math.min(...ys), high = Math.max(...ys);
  pts.forEach(p => { p.x -= (left + right) / 2; p.y -= (low + high) / 2; });
  return { pts, edges, w: right - left, h: high - low };
}

// ── LAYOUT ──
// Each constellation and its label get a box, and the boxes are nudged apart until none
// overlap. They start in the class's fixed order, so a constellation that grows moves its
// neighbours aside without trading places with them.
const GAP_X = 30, GAP_Y = 22;   // screen pixels between neighbouring boxes (half that on phones)
const LABEL_GAP = 8;            // screen pixels between a figure and its label
const MARGIN = 16;
let sky = { cx: 0, cy: 0, scale: 1, w: 1, h: 1 };

function arrange(clusters) {
  const n = clusters.length;
  if (!n) return;
  const rank = name => { const i = CONSTELLATIONS.indexOf(name); return i < 0 ? CONSTELLATIONS.length : i; };
  const order = [...clusters].sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name));
  const aspect = Math.min(2.4, Math.max(0.5, W / H));
  const gaps = W < 500 ? 0.5 : 1;
  let scale = 1.5;                // world units per screen pixel; the boxes depend on it, so it takes a few passes
  for (let pass = 0; pass < 5; pass++) {
    order.forEach(c => {
      c.hw = (Math.max(c.w, c.labelW * scale) + GAP_X * gaps * scale) / 2;
      c.hh = (c.h + (c.labelH + LABEL_GAP + GAP_Y * gaps) * scale) / 2;
    });
    const spread = Math.sqrt(order.reduce((s, c) => s + c.hw * c.hh * 4, 0)) * 0.6;
    order.forEach((c, i) => {
      const r = Math.sqrt((i + 0.5) / n) * spread, phi = i * Math.PI * (3 - Math.sqrt(5));
      c.x = Math.cos(phi) * r * Math.sqrt(aspect);
      c.y = Math.sin(phi) * r / Math.sqrt(aspect);
    });
    for (let k = 0; k < 700; k++) {
      // Everything drifts inward to fill the screen's shape, then the last rounds only separate.
      if (k < 500) order.forEach(c => { c.x *= 1 - 0.012 / aspect; c.y *= 1 - 0.012 * aspect; });
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = order[i], b = order[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const ox = a.hw + b.hw - Math.abs(dx), oy = a.hh + b.hh - Math.abs(dy);
          if (ox <= 0 || oy <= 0) continue;
          if (ox < oy) { const s = (dx < 0 ? -ox : ox) / 2; a.x -= s; b.x += s; }
          else { const s = (dy < 0 ? -oy : oy) / 2; a.y -= s; b.y += s; }
        }
      }
    }
    const left = Math.min(...order.map(c => c.x - c.hw)), right = Math.max(...order.map(c => c.x + c.hw));
    const low = Math.min(...order.map(c => c.y - c.hh)), high = Math.max(...order.map(c => c.y + c.hh));
    scale = Math.max((right - left) / (W - MARGIN * 2), (high - low) / (H - MARGIN * 2));
    sky = { cx: (left + right) / 2, cy: (low + high) / 2, scale, w: right - left, h: high - low };
  }
  // The figure sits at the top of its box, with the label under it.
  order.forEach(c => { c.fx = c.x; c.fy = c.y + (c.labelH + LABEL_GAP) * scale / 2; });
}

function lineGeometry(segments) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(segments * 6), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(segments * 6), 3));
  return geo;
}

// Cross-references are drawn as arcs that bow upward, so they read as different from a figure's lines.
const ARC = 24;
function arcPoint(a, b, t, out) {
  const dx = b.x - a.x, dy = b.y - a.y, flip = dx > 0 ? 1 : -1, bow = 0.18;
  const mx = (a.x + b.x) / 2 - dy * bow * flip, my = (a.y + b.y) / 2 + dx * bow * flip;
  const u = 1 - t;
  return out.set(u * u * a.x + 2 * u * t * mx + t * t * b.x, u * u * a.y + 2 * u * t * my + t * t * b.y, a.z + (b.z - a.z) * t);
}

// Works out where everything goes on screen and copies it into what is drawn.
const p0 = new THREE.Vector3(), p1 = new THREE.Vector3();
function place() {
  arrange(world.clusters);
  world.clusters.forEach(c => {
    c.members.forEach((e, i) => e._pos.set(c.fx + c.pts[i].x, c.fy + c.pts[i].y, c.pts[i].z));
    c.bottom.set(c.fx, c.fy - c.h / 2, 0);
  });
  const sp = world.starGeo.attributes.position;
  world.stars.forEach((s, i) => s.e._pos.toArray(sp.array, i * 3));
  sp.needsUpdate = true;
  // Lines stop just short of their stars, as on a printed chart.
  const lp = world.linkGeo.attributes.position, gap = 4.5 * sky.scale;
  world.links.forEach(([a, b], i) => {
    const dir = p0.subVectors(b._pos, a._pos), len = dir.length();
    const trim = Math.min(gap, len * 0.3);
    p1.copy(a._pos).addScaledVector(dir, trim / len).toArray(lp.array, i * 6);
    p1.copy(b._pos).addScaledVector(dir, -trim / len).toArray(lp.array, i * 6 + 3);
  });
  lp.needsUpdate = true;
  const xp = world.xrefGeo.attributes.position;
  world.xrefs.forEach(([a, b], i) => {
    for (let k = 0; k < ARC; k++) {
      arcPoint(a._pos, b._pos, k / ARC, p0).toArray(xp.array, (i * ARC + k) * 6);
      arcPoint(a._pos, b._pos, (k + 1) / ARC, p0).toArray(xp.array, (i * ARC + k) * 6 + 3);
    }
  });
  xp.needsUpdate = true;
}

// ── BUILD ──
let world = null;
let focus = null;      // name of the constellation being looked at, or null for all
let peek = null;       // name of the constellation under the pointer in the list or on the chart
let hovered = null;    // the star under the pointer
let pinned = null;     // the star tapped on a touch screen
let showXrefs = false; // are the cross-references showing?
let homeDistance = 1000;

function build(all) {
  const list = all.filter(e => !isBlank(e));
  const shownNo = new Map(list.map(e => e.id).sort((a, b) => a - b).map((id, i) => [id, i + 1]));

  if (world) {
    world.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    scene.remove(world.group);
  }
  el('labels').innerHTML = '';

  const groups = new Map();
  list.forEach(e => {
    e._pos = new THREE.Vector3();
    const c = categoryOf(e);
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(e);
  });
  const names = [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length || a.localeCompare(b));
  const clusters = names.map(name => {
    const members = groups.get(name).sort((a, b) => a.id - b.id);
    return { name, members, bottom: new THREE.Vector3(), ...grow(name, members) };
  });

  clusters.forEach(c => {
    const b = document.createElement('button');
    b.className = 'label';
    b.textContent = c.name;
    b.addEventListener('click', () => flyTo(c));
    b.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse') setPeek(c); });
    b.addEventListener('pointerleave', () => setPeek(null));
    el('labels').appendChild(b);
    c.label = b;
    c.labelW = b.offsetWidth;
    c.labelH = b.offsetHeight;
  });

  const byId = new Map(list.map(e => [e.id, e]));
  const xrefs = list.filter(e => e.xrefId && e.xrefId !== e.id && byId.has(e.xrefId)).map(e => [e, byId.get(e.xrefId)]);
  const crossed = new Set(xrefs.flat());
  const clusterOf = new Map(clusters.flatMap(c => c.members.map(e => [e, c])));

  // Stars vary a little in brightness, as in the sky; the cross-referenced ones stand out.
  const stars = clusters.flatMap(c => c.members.map(e => ({
    e, no: shownNo.get(e.id), cluster: c,
    size: crossed.has(e) ? 25 : 15 + seeded(e.id * 104729)() * 6
  })));

  const group = new THREE.Group();
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(stars.length * 3), 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(stars.length * 3), 3));
  starGeo.setAttribute('size', new THREE.BufferAttribute(new Float32Array(stars.length), 1));
  const links = clusters.flatMap(c => c.edges.map(([a, b]) => [c.members[a], c.members[b], c]));
  const linkGeo = lineGeometry(links.length), xrefGeo = lineGeometry(xrefs.length * ARC);
  const drawn = [
    new THREE.Points(starGeo, starMaterial),
    new THREE.LineSegments(linkGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55, depthWrite: false })),
    new THREE.LineSegments(xrefGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }))
  ];
  drawn.forEach(o => { o.frustumCulled = false; group.add(o); });
  scene.add(group);

  if (focus && !clusters.some(c => c.name === focus)) focus = null;
  if (peek && !clusters.some(c => c.name === peek)) peek = null;
  if (hovered) hovered = stars.find(s => s.e.id === hovered.e.id) || null;
  if (pinned) pinned = stars.find(s => s.e.id === pinned.e.id) || null;
  world = { group, stars, clusters, links, xrefs, clusterOf, starGeo, linkGeo, xrefGeo };

  place();
  frameView();

  el('stats').innerHTML = [[list.length, 'fragments'], [clusters.length, 'constellations'], [xrefs.length, 'cross-references']].map(([n, what]) => `<span>${n} ${what}</span>`).join(' ');
  renderLegend();
  paint();
  showTip();
}

// Colors stars and lines: the constellation in focus is bright, the rest fade back.
function paint() {
  if (!world) return;
  const lit = c => (!focus && !peek) || c.name === focus || c.name === peek;
  const star = pinned || hovered;
  const sc = world.starGeo.attributes.color, ss = world.starGeo.attributes.size;
  world.stars.forEach((s, i) => {
    const col = s === star ? COLOR.hover : lit(s.cluster) ? COLOR.star : COLOR.starDim;
    col.toArray(sc.array, i * 3);
    ss.array[i] = s === star ? s.size * 1.5 : s.size;
  });
  sc.needsUpdate = ss.needsUpdate = true;
  const lc = world.linkGeo.attributes.color;
  world.links.forEach(([, , c], i) => {
    const col = lit(c) ? COLOR.link : COLOR.linkDim;
    col.toArray(lc.array, i * 6); col.toArray(lc.array, i * 6 + 3);
  });
  lc.needsUpdate = true;
  const looking = focus || peek;
  const xc = world.xrefGeo.attributes.color;
  world.xrefs.forEach(([a, b], i) => {
    const touched = (star && (star.e === a || star.e === b)) ||
      (looking && (lit(world.clusterOf.get(a)) || lit(world.clusterOf.get(b))));
    const col = !showXrefs ? COLOR.off : touched ? COLOR.xref : looking ? COLOR.xrefDim : COLOR.xrefSoft;
    for (let k = 0; k < ARC * 2; k++) col.toArray(xc.array, (i * ARC * 2 + k) * 3);
  });
  xc.needsUpdate = true;
  world.clusters.forEach(c => c.label.classList.toggle('dim', !lit(c)));
}

function setPeek(c) {
  peek = c ? c.name : null;
  paint();
}

function renderLegend() {
  const nav = el('legend');
  nav.innerHTML = '';
  const add = (text, count, c) => {
    const b = document.createElement('button');
    b.innerHTML = `<span>${escapeHtml(text)}</span><span class="count">${count}</span>`;
    b.addEventListener('click', () => flyTo(c));
    if (c) {
      b.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse') setPeek(c); });
      b.addEventListener('pointerleave', () => setPeek(null));
    }
    b.dataset.name = c ? c.name : '';
    nav.appendChild(b);
  };
  add('The whole sky', world.stars.length, null);
  world.clusters.forEach(c => add(c.name, c.members.length, c));
  markLegend();
}

function markLegend() {
  [...el('legend').children].forEach(b => {
    const on = b.dataset.name === (focus || '');
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
  });
}

el('xrefToggle').addEventListener('click', ev => {
  showXrefs = !showXrefs;
  ev.currentTarget.textContent = showXrefs ? 'Hide cross-references' : 'Show cross-references';
  ev.currentTarget.classList.toggle('on', showXrefs);
  paint();
});

// ── CAMERA ──
const toRad = Math.PI / 180;
const distanceFor = scale => H * scale / 2 / Math.tan(FOV * toRad / 2);

// Where the camera should be to show one constellation, or the whole sky.
function viewOf(c) {
  if (!c) return { target: new THREE.Vector3(sky.cx, sky.cy, 0), distance: homeDistance };
  const pad = STEP * 5;
  const scale = Math.max((c.w + pad) / W, (c.h + pad) / H);
  return { target: new THREE.Vector3(c.fx, c.fy, 0), distance: Math.min(homeDistance, distanceFor(scale)) };
}

function jumpTo(view) {
  flight = null;
  controls.target.copy(view.target);
  camera.position.copy(view.target).setZ(view.distance);
}

// Fits the view to the sky after anything changes its size or shape. A view someone chose stays put.
function frameView() {
  homeDistance = distanceFor(sky.scale);
  controls.minDistance = homeDistance * 0.06;
  controls.maxDistance = homeDistance * 1.25;
  controls.cursor.set(sky.cx, sky.cy, 0);
  controls.maxTargetRadius = Math.max(sky.w, sky.h) * 0.6;
  const c = focus && world.clusters.find(x => x.name === focus);
  if (c) jumpTo(viewOf(c));
  else if (!moved) jumpTo(viewOf(null));
}

let flight = null;
function flyTo(c) {
  focus = c ? c.name : null;
  pinned = null;
  moved = false;
  markLegend();
  paint();
  showTip();
  const { target, distance } = viewOf(c);
  flight = {
    t0: performance.now(), dur: CALM ? 0 : 900,
    fromT: controls.target.clone(), toT: target,
    fromP: camera.position.clone(), toP: target.clone().setZ(distance)
  };
}

function resize() {
  W = Math.max(1, el('stage').clientWidth);
  H = Math.max(1, el('stage').clientHeight);
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  if (world) { place(); frameView(); }
}
new ResizeObserver(resize).observe(el('stage'));
resize();

// ── POINTING AT STARS ──
const v = new THREE.Vector3();
function toScreen(p) {
  v.copy(p).project(camera);
  return { x: (v.x + 1) / 2 * W, y: (1 - v.y) / 2 * H };
}

function starAt(x, y) {
  if (!world) return null;
  let best = null, bestD = 20 * 20;
  world.stars.forEach(s => {
    const p = toScreen(s.e._pos);
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bestD) { bestD = d; best = s; }
  });
  return best;
}

function showTip() {
  const s = pinned || hovered;
  const tip = el('tip');
  if (!s) { tip.hidden = true; return; }
  const e = s.e;
  const text = e.fragment || e.annotation || '';
  const frag = text.length > 220 ? text.slice(0, 220).trim() + '…' : text;
  tip.innerHTML = `
    <div class="meta mono">No. ${String(s.no).padStart(3, '0')}${entrantOf(e) ? ` · <b>${escapeHtml(entrantOf(e))}</b>` : ''}</div>
    <p class="frag">${escapeHtml(frag)}</p>
    <div class="cat mono">${escapeHtml(categoryOf(e))}</div>
    <a href="index.html#entry-${e.id}">Open in the archive →</a>`;
  tip.hidden = false;
  placeTip();
}

function placeTip() {
  const s = pinned || hovered;
  const tip = el('tip');
  if (!s || tip.hidden) return;
  const p = toScreen(s.e._pos);
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = p.x + 16, y = p.y + 16;
  if (x + w > W - 8) x = p.x - w - 16;
  if (y + h > H - 8) y = p.y - h - 16;
  tip.style.transform = `translate(${Math.max(8, x)}px, ${Math.max(8, y)}px)`;
}

const canvas = renderer.domElement;
const lean = new THREE.Vector2(), leanTo = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointermove', ev => {
  if (ev.pointerType !== 'mouse') return;
  if (!CALM) leanTo.set(ev.offsetX / W - 0.5, ev.offsetY / H - 0.5);
  if (pinned) return;
  const s = starAt(ev.offsetX, ev.offsetY);
  canvas.style.cursor = s ? 'pointer' : 'grab';
  if (s !== hovered) { hovered = s; paint(); showTip(); }
});
canvas.addEventListener('pointerleave', () => { leanTo.set(0, 0); if (hovered && !pinned) { hovered = null; paint(); showTip(); } });
canvas.addEventListener('pointerdown', ev => { down = { x: ev.clientX, y: ev.clientY }; });
canvas.addEventListener('pointerup', ev => {
  if (!down || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6) return;   // a drag, not a click
  const s = starAt(ev.offsetX, ev.offsetY);
  if (s && ev.pointerType === 'mouse') { location.href = `index.html#entry-${s.e.id}`; return; }
  // On touch screens a tap shows the star's card, which has the link to open it.
  pinned = s;
  hovered = null;
  paint();
  showTip();
});

// ── LABELS & ANIMATION ──
function placeLabels() {
  world.clusters.forEach(c => {
    const p = toScreen(c.bottom);
    const on = p.x > -120 && p.x < W + 120 && p.y > -40 && p.y < H + 40;
    c.label.style.display = on ? '' : 'none';
    if (on) c.label.style.transform = `translate(-50%, ${LABEL_GAP}px) translate(${p.x}px, ${p.y}px)`;
  });
}

const rest = new THREE.Vector3();
function animate(now) {
  requestAnimationFrame(animate);
  if (flight) {
    const k = flight.dur ? Math.min(1, (now - flight.t0) / flight.dur) : 1;
    const ease = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    controls.target.lerpVectors(flight.fromT, flight.toT, ease);
    camera.position.lerpVectors(flight.fromP, flight.toP, ease);
    if (k === 1) flight = null;
  }
  controls.update();
  const distance = camera.position.z - controls.target.z;
  const pxPerUnit = H / (2 * distance * Math.tan(FOV * toRad / 2));
  starMaterial.uniforms.zoom.value = renderer.getPixelRatio() * Math.min(1.7, Math.max(0.3, pxPerUnit ** 0.75));
  // The camera leans a touch toward the pointer, which lifts the chart off the stars behind it.
  lean.lerp(leanTo, 0.05);
  rest.copy(camera.position);
  camera.position.x += lean.x * distance * 0.05;
  camera.position.y -= lean.y * distance * 0.05;
  camera.lookAt(controls.target);
  camera.updateMatrixWorld();
  renderer.render(scene, camera);
  if (world) { placeLabels(); placeTip(); }
  camera.position.copy(rest);
}
requestAnimationFrame(animate);

// ── LIVE DATA ──
const db = getFirestore(initializeApp(firebaseConfig));
onSnapshot(collection(db, 'entries'), snap => {
  build(snap.docs.map(d => d.data()));
}, err => {
  el('stats').textContent = 'Could not load the archive: ' + err.message;
});
</script>
</body>
</html>

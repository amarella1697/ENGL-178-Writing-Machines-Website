name: Nightly backup

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 1 AM Pacific (midnight in winter)
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node backup.js
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "Nightly backup $(date -u +%F)"
          # GitHub occasionally fails a push on its end, so try a few times before giving up.
          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "Push attempt $attempt of 4 failed"
            if [ "$attempt" -lt 4 ]; then sleep 60; fi
          done
          exit 1
